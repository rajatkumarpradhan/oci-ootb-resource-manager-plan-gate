[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-rm-plan-gate"
version = "0.1.0"
description = "Pre-apply safety gate for Terraform plan JSON, in the spirit of an OCI Resource Manager plan/apply gate"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
